media:
  - name: images
    label: Images
    input: assets/media
    output: /assets/media
    extensions: [jpg, jpeg, png, webp, svg]

content:
  - name: home
    label: Home Page
    type: file
    path: content/home.json
    format: json
    operations:
      delete: false
    fields:
      - name: site
        label: Brand
        type: object
        fields:
          - name: brand
            label: Brand Name
            type: string
          - name: logo
            label: Logo
            type: image
            options:
              media: images
          - name: slogan
            label: Slogan
            type: string

      - name: hero
        label: Hero Slider
        type: object
        fields:
          - name: slides
            label: Slides
            type: object
            list:
              min: 1
              max: 8
              collapsible:
                collapsed: true
                summary: "Slide {index}"
            fields:
              - name: image
                label: Image
                type: image
                options:
                  media: images
              - name: title_ar
                label: Arabic Title
                type: text
              - name: title_en
                label: English Title
                type: text
              - name: text_ar
                label: Arabic Description
                type: text
              - name: text_en
                label: English Description
                type: text

      - name: services
        label: Services
        type: object
        list:
          min: 6
          max: 6
          collapsible:
            collapsed: true
            summary: "{title_ar}"
        fields:
          - name: title_ar
            label: Arabic Title
            type: string
            required: true
          - name: title_en
            label: English Title
            type: string
            required: true
          - name: desc_ar
            label: Arabic Description
            type: text
          - name: desc_en
            label: English Description
            type: text

      - name: about
        label: About PRIME
        type: object
        fields:
          - name: title_ar
            label: Arabic Title
            type: text
          - name: title_en
            label: English Title
            type: text
          - name: body_ar
            label: Arabic Paragraphs
            type: list
            field:
              name: paragraph
              type: text
          - name: body_en
            label: English Paragraphs
            type: list
            field:
              name: paragraph
              type: text

      - name: why
        label: Why PRIME
        type: object
        list:
          min: 3
          max: 8
          collapsible:
            collapsed: true
            summary: "{title_ar}"
        fields:
          - name: title_ar
            label: Arabic Title
            type: string
          - name: title_en
            label: English Title
            type: string
          - name: desc_ar
            label: Arabic Description
            type: text
          - name: desc_en
            label: English Description
            type: text

      - name: work
        label: Our Work
        type: object
        list:
          min: 1
          max: 20
          collapsible:
            collapsed: true
            summary: "{title_ar}"
        fields:
          - name: image
            label: Project Image
            type: image
            options:
              media: images
          - name: category
            label: Category
            type: string
          - name: title_ar
            label: Arabic Title
            type: string
          - name: title_en
            label: English Title
            type: string

      - name: profile
        label: Company Profile
        type: object
        fields:
          - name: title_ar
            label: Arabic Title
            type: text
          - name: title_en
            label: English Title
            type: text
          - name: body_ar
            label: Arabic Text
            type: text
          - name: body_en
            label: English Text
            type: text

      - name: contact
        label: Contact
        type: object
        fields:
          - name: email
            label: Email
            type: string
          - name: whatsapp
            label: WhatsApp
            type: string
          - name: website
            label: Website
            type: string
