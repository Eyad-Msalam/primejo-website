backend:
  name: github
  repo: Eyad-Msalam/primejo-website
  branch: main

media_folder: "assets/media"
public_folder: "/assets/media"

site_url: https://primejo.com
display_url: https://primejo.com
logo_url: /assets/brand/prime-logo.png

collections:
  - name: home
    label: Home Page
    files:
      - file: "content/home.json"
        label: Home Content
        name: home_content
        format: json
        fields:
          - label: Site
            name: site
            widget: object
            fields:
              - {label: Brand Name, name: brand, widget: string}
              - {label: Logo, name: logo, widget: image}
              - {label: Slogan, name: slogan, widget: string}

          - label: Hero Slider
            name: hero
            widget: object
            fields:
              - label: Slides
                name: slides
                widget: list
                min: 1
                max: 8
                fields:
                  - {label: Image, name: image, widget: image}
                  - {label: Arabic Title, name: title_ar, widget: text}
                  - {label: English Title, name: title_en, widget: text}
                  - {label: Arabic Description, name: text_ar, widget: text}
                  - {label: English Description, name: text_en, widget: text}

          - label: Services
            name: services
            widget: list
            min: 6
            max: 6
            fields:
              - {label: Arabic Title, name: title_ar, widget: string}
              - {label: English Title, name: title_en, widget: string}
              - {label: Arabic Description, name: desc_ar, widget: text}
              - {label: English Description, name: desc_en, widget: text}

          - label: About PRIME
            name: about
            widget: object
            fields:
              - {label: Arabic Title, name: title_ar, widget: text}
              - {label: English Title, name: title_en, widget: text}
              - label: Arabic Paragraphs
                name: body_ar
                widget: list
                field: {label: Paragraph, name: paragraph, widget: text}
              - label: English Paragraphs
                name: body_en
                widget: list
                field: {label: Paragraph, name: paragraph, widget: text}

          - label: Why PRIME
            name: why
            widget: list
            fields:
              - {label: Arabic Title, name: title_ar, widget: string}
              - {label: English Title, name: title_en, widget: string}
              - {label: Arabic Description, name: desc_ar, widget: text}
              - {label: English Description, name: desc_en, widget: text}

          - label: Our Work
            name: work
            widget: list
            fields:
              - {label: Project Image, name: image, widget: image}
              - {label: Category, name: category, widget: string}
              - {label: Arabic Title, name: title_ar, widget: string}
              - {label: English Title, name: title_en, widget: string}

          - label: Company Profile
            name: profile
            widget: object
            fields:
              - {label: Arabic Title, name: title_ar, widget: text}
              - {label: English Title, name: title_en, widget: text}
              - {label: Arabic Text, name: body_ar, widget: text}
              - {label: English Text, name: body_en, widget: text}

          - label: Contact
            name: contact
            widget: object
            fields:
              - {label: Email, name: email, widget: string}
              - {label: WhatsApp, name: whatsapp, widget: string}
              - {label: Website, name: website, widget: string}

  - name: pages
    label: Pages
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    format: json
    extension: "json"
    fields:
      - {label: Arabic Title, name: title_ar, widget: string}
      - {label: English Title, name: title_en, widget: string}
      - {label: Arabic Content, name: content_ar, widget: markdown}
      - {label: English Content, name: content_en, widget: markdown}
      - {label: Cover Image, name: cover_image, widget: image, required: false}
      - {label: SEO Description AR, name: seo_ar, widget: text, required: false}
      - {label: SEO Description EN, name: seo_en, widget: text, required: false}
